version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: main
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /infra/migration
    schedule:
      interval: weekly
      day: monday
    target-branch: main
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: main
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: main
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /infra/backup
    schedule:
      interval: weekly
      day: monday
    target-branch: main
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /infra/migration
    schedule:
      interval: weekly
      day: monday
    target-branch: main
    open-pull-requests-limit: 5
